name: Release

# Push a tag like v0.3.1: each system's build is attached to one draft release for you to check and publish.
# The names of the files are what the app's own updater asks for; do not change them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --generate-notes --title "Maestro ${{ github.ref_name }}"

  build:
    needs: draft
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, asset: maestro-windows-x64.zip }
          - { name: Linux, os: ubuntu-22.04, asset: maestro-linux-x64.tar.gz }
          - { name: macOS (Apple silicon), os: macos-latest, asset: maestro-macos-arm64.tar.gz }
          - { name: macOS (Intel), os: macos-latest, asset: maestro-macos-x64.tar.gz, target: x86_64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev tmux
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tests
        if: matrix.target == ''
        working-directory: src-tauri
        run: cargo test
      - name: Release build
        working-directory: src-tauri
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Pack
        run: |
          mkdir out
          cp LICENSE README.md maestro.config.example.json out/
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/maestro.exe out/
            [ -f src-tauri/target/release/WebView2Loader.dll ] && cp src-tauri/target/release/WebView2Loader.dll out/
            (cd out && 7z a -tzip "../${{ matrix.asset }}" . >/dev/null)
          else
            cp "src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/maestro" out/
            cp tools/install.sh out/
            chmod +x out/maestro out/install.sh
            tar -czf "${{ matrix.asset }}" -C out .
          fi
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --repo "${{ github.repository }}" --clobber
