<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maestro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; cursor: none; overflow: hidden; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<script>
// One of these covers each display in black, and the displays are switched off under it. Sessions go on working and the
// computer is kept awake. A key or a click brings the screens back. Moving the mouse does not: it lights the displays, as it
// would after any idle time, they stay black, and once the mouse has settled they are switched off again.
const began = Date.now();
const back = (e) => { if (e) e.preventDefault(); if (Date.now() - began < 500) return; window.__TAURI__.core.invoke('blackout_end').catch(() => {}); };
for (const ev of ['keydown', 'mousedown', 'touchstart']) addEventListener(ev, back, { passive: false });
addEventListener('contextmenu', (e) => e.preventDefault());
let settled = 0;
addEventListener('mousemove', () => { if (Date.now() - began < 2500) return; clearTimeout(settled); settled = setTimeout(() => window.__TAURI__.core.invoke('blackout_dim').catch(() => {}), 2500); });
</script>
</body>
</html>
