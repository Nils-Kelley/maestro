<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maestro</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
/* Flight deck. One sheet of dark glass over the desktop; thin strokes, one cool accent, numbers in mono. The box at the top is always
   live; the left column is what matched, the right is the thing itself. Status is a shape and a word, never colour alone. */
:root {
  --glass: rgba(9, 12, 17, 0.72); --raise: rgba(255, 255, 255, 0.035); --raise2: rgba(255, 255, 255, 0.06); --line: rgba(255, 255, 255, 0.085); --line2: rgba(255, 255, 255, 0.16);
  --fg: #eef1f5; --ink2: #c0c6cf; --dim: #8a92a0; --faint: #5a6270; --accent: #5cc8ff; --sel: rgba(92, 200, 255, 0.1);
  --ok: #2fb65a; --warn: #fab219; --bad: #f0605f; --track: rgba(255, 255, 255, 0.07);
  --s1: #27405f; --s2: #2f5d92; --s3: #3d7fc6; --s4: #62a4ee; --s5: #a9d0fb; /* one hue, further along = lighter (the ledger's stages) */
  --sans: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif; --disp: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif; --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: transparent; color: var(--fg); font: 13.5px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
:root { color-scheme: dark; } /* the lists the system draws (a plain select) are dark too */
::selection { background: rgba(92, 200, 255, 0.3); }
#panel { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: var(--glass); border: 1px solid var(--line2); border-radius: 0; overflow: hidden; }
#panel::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, rgba(92, 200, 255, 0.55) 18%, rgba(92, 200, 255, 0.55) 34%, transparent 62%); pointer-events: none; }
#panel.in { animation: rise 170ms var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
#top { display: flex; align-items: center; gap: 12px; padding: 16px 22px 11px; }
#top svg { flex: none; color: var(--accent); }
#q { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font: 400 20px/1.3 var(--disp); letter-spacing: -0.012em; caret-color: var(--accent); }
#q::placeholder { color: var(--faint); }
#proj { color: var(--dim); white-space: nowrap; }
/* the project picker: a button that opens a searchable list (favourites first), wherever a project is chosen */
.pick { display: inline-flex; align-items: center; gap: 7px; max-width: 220px; background: var(--raise); border: 1px solid var(--line); border-radius: 7px; color: var(--fg); font: inherit; font-size: 13px; padding: 4px 8px 4px 10px; cursor: pointer; transition: background 120ms, border-color 120ms; }
.pick:hover, .pick[aria-expanded="true"] { background: var(--raise2); border-color: var(--line2); }
.pick .pl { color: var(--dim); } .pick .pn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; } .pick svg { flex: none; color: var(--dim); }
.menu { position: fixed; z-index: 200; width: 330px; max-height: min(440px, calc(100vh - 80px)); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: #11161d; border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55); overflow: hidden; }
.menu .mq { background: none; border: 0; border-bottom: 1px solid var(--line); outline: 0; color: var(--fg); font: 13.5px var(--sans); padding: 10px 13px; caret-color: var(--accent); } .menu .mq::placeholder { color: var(--faint); }
.menu .ml { overflow-y: auto; padding: 4px; } .menu .mg { color: var(--faint); font-size: 11.5px; padding: 7px 9px 3px; }
.menu .mi { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.menu .mi[aria-selected="true"] { background: var(--sel); } .menu .mi .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .menu .mi .mt { color: var(--dim); font-size: 12px; white-space: nowrap; }
.menu .mi .ck { width: 12px; color: var(--accent); } .menu .none { color: var(--dim); padding: 10px 9px; }
.menu .mf { text-align: left; background: none; border: 0; border-top: 1px solid var(--line); color: var(--ink2); font: inherit; font-size: 12.5px; padding: 9px 13px; cursor: pointer; } .menu .mf:hover { background: var(--raise); color: var(--fg); }
#tabsrow { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-right: 14px; min-width: 0; }
#tabs { display: flex; gap: 20px; padding: 0 22px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; } #tabs::-webkit-scrollbar { display: none; }
#tabs button { white-space: nowrap; flex: none; }
#popview { display: inline-flex; gap: 6px; align-items: center; background: none; border: 1px solid transparent; border-radius: 7px; color: var(--dim); font: inherit; font-size: 12.5px; padding: 3px 8px; cursor: pointer; flex: none; } #popview:hover { color: var(--fg); border-color: var(--line2); background: var(--raise); }
button.star { background: none; border: 0; color: var(--faint); font-size: 15px; line-height: 1; cursor: pointer; padding: 0 4px; } button.star:hover { color: var(--warn); } button.star.on { color: var(--warn); }
.win button[aria-pressed="true"] { color: var(--accent); background: var(--sel); }
/* a view in a window of its own: an ordinary window with the system's frame, showing that one view */
body.view { background: #0d1116; } body.view #panel { border: 0; background: #0d1116; } body.view #panel::before { display: none; } body.view .win, body.view #tabsrow, body.view #boot { display: none; }
body.view #top { padding-top: 12px; } #vtitle { font: 600 15px var(--disp); white-space: nowrap; } #vtitle:empty { display: none; }
#tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); font: inherit; padding: 6px 0 9px; cursor: pointer; transition: color 120ms; }
#tabs button:hover { color: var(--ink2); }
#tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
#tabs button span { color: var(--faint); margin-left: 5px; font: 11.5px var(--mono); }
#body { min-height: 0; display: grid; grid-template-columns: 410px minmax(0, 1fr); }
#body.home { grid-template-columns: minmax(0, 1fr); }
#list { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; }
#body.home #list { display: none; }
.item { position: relative; display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.item:hover { background: var(--raise); }
.item[aria-selected="true"] { background: var(--sel); }
.item[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 1px; background: var(--accent); }
.item .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { display: block; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.new { color: var(--accent); }
.group { color: var(--faint); font-size: 12px; padding: 10px 12px 3px; }
#view { overflow-y: auto; padding: 20px 26px 26px; min-width: 0; }
#view > * { animation: fade 130ms var(--ease); }
#view h1 { font: 600 18px/1.3 var(--disp); margin: 0 0 3px; letter-spacing: -0.012em; }
#view .meta { color: var(--dim); font-size: 12.5px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 5px 14px; align-items: center; }
#view .text { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 80ch; color: var(--ink2); }
#view .text b { color: var(--fg); font-weight: 600; }
#view .text h2 { font: 600 14px var(--sans); color: var(--fg); margin: 14px 0 2px; }
#view .text code, code { font-family: var(--mono); font-size: 12.5px; background: var(--raise2); padding: 0 4px; border-radius: 3px; }
#view .text mark { background: rgba(92, 200, 255, 0.24); color: inherit; border-radius: 2px; }
textarea { width: 100%; height: calc(100% - 96px); min-height: 300px; resize: none; background: rgba(0, 0, 0, 0.3); color: var(--fg); border: 1px solid var(--line2); border-radius: 8px; padding: 12px; font: 12.5px/1.6 var(--mono); outline: 0; }
textarea:focus, input.in:focus, select.in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92, 200, 255, 0.12); }
button.act { background: var(--raise); border: 1px solid var(--line2); border-radius: 7px; color: var(--fg); font: inherit; font-size: 12.5px; padding: 3px 10px; cursor: pointer; transition: background 120ms, border-color 120ms; }
button.act:hover { background: var(--raise2); border-color: rgba(255, 255, 255, 0.26); }
button.act.go { background: var(--accent); color: #04121b; border-color: var(--accent); font-weight: 600; }
button.act:disabled { opacity: 0.55; cursor: default; }
kbd { font: 11px var(--mono); color: var(--dim); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
#foot { display: flex; gap: 18px; align-items: center; padding: 8px 22px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12.5px; }
#foot .msg { margin-left: auto; } #foot .msg.bad { color: var(--bad); } #foot .msg.ok { color: var(--ok); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { color: var(--dim); }
h3.sec { font: 600 12.5px var(--sans); color: var(--dim); margin: 22px 0 8px; letter-spacing: 0.01em; }
table { border-collapse: collapse; width: 100%; } td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; } td.k { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12.5px; padding: 5px 12px 5px 0; border-bottom: 1px solid var(--line2); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
input.in, select.in { background: rgba(0, 0, 0, 0.3); color: var(--fg); border: 1px solid var(--line2); border-radius: 7px; padding: 3px 8px; font: inherit; font-size: 12.5px; outline: 0; } select.in option { background: #10141a; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .lead { color: var(--dim); max-width: 80ch; margin: 0 0 12px; }
.slot { margin: 0 0 14px; } .slot:empty { display: none; }
label.chk { display: inline-flex; gap: 8px; align-items: center; color: var(--dim); cursor: pointer; }
.form { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 14px; align-items: start; max-width: 780px; } .form label { color: var(--dim); padding-top: 4px; } .form input.in, .form select.in { width: 100%; padding: 6px 9px; font-size: 13.5px; } .form textarea { height: 250px; min-height: 0; }

/* ---- the deck (home) ---- */
.deck { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; }
.pane { position: relative; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 15px; min-width: 0; }
.pane.wide { grid-column: 1 / -1; }
.pane::before, .pane::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1px solid rgba(92, 200, 255, 0.5); pointer-events: none; }
.pane::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.pane::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
.pane h2 { font: 600 12.5px var(--sans); color: var(--dim); margin: 0 0 10px; letter-spacing: 0.01em; display: flex; justify-content: space-between; gap: 12px; }
.pane h2 span { font-weight: 400; color: var(--faint); }
.need { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); color: inherit; font: inherit; padding: 7px 4px; cursor: pointer; border-radius: 0; }
.need:first-of-type { border-top: 0; }
.need:hover { background: var(--raise); }
.need .st { display: inline-flex; gap: 6px; align-items: center; min-width: 78px; font-size: 12.5px; color: var(--ink2); padding-top: 1px; }
.need .go { color: var(--faint); font: 11.5px var(--mono); white-space: nowrap; padding-top: 2px; }
.need b { font-weight: 600; } .need .why { display: block; color: var(--dim); font-size: 12.5px; }
.glyph { flex: none; }
.meters { display: grid; grid-template-columns: minmax(0, 150px) minmax(60px, 1fr) auto; gap: 9px 12px; align-items: center; }
.meters .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink2); }
.meters .v { font: 12px var(--mono); color: var(--ink2); white-space: nowrap; text-align: right; }
.mtrack { position: relative; height: 8px; background: var(--track); border-radius: 4px; }
.mtrack i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); width: 0; transition: width 620ms var(--ease); }
.mtrack i.warn { background: var(--warn); } .mtrack i.bad { background: var(--bad); }
.mtrack u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; } /* the limit */
.seg { display: flex; gap: 2px; height: 14px; }
.seg i { display: block; height: 100%; min-width: 3px; border-radius: 3px; flex: 0 0 auto; width: 0; transition: width 620ms var(--ease); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; color: var(--ink2); font-size: 12.5px; }
.legend span { display: inline-flex; gap: 7px; align-items: center; } .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; } .legend b { font: 12px var(--mono); font-weight: 400; color: var(--fg); }
.reads { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
.read { text-align: left; background: none; border: 0; border-left: 1px solid var(--line); color: inherit; font: inherit; padding: 2px 14px 3px; cursor: pointer; }
.read:first-child { border-left: 0; padding-left: 2px; }
.read:hover .big { color: var(--accent); }
.read .big { display: block; font: 300 26px/1.15 var(--disp); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; transition: color 120ms; }
.read .lab { display: block; color: var(--dim); font-size: 12.5px; } .read .sub { display: block; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 44px; }
.spark i { flex: 1; min-width: 2px; background: #4d6f96; border-radius: 2px 2px 0 0; min-height: 1px; }
.spark i.now { background: var(--accent); } .spark i:hover { background: var(--s5); }
.axis { display: flex; justify-content: space-between; color: var(--faint); font: 11.5px var(--mono); margin-top: 5px; }
#tip { position: fixed; z-index: 9; pointer-events: none; background: #0b0f14; border: 1px solid var(--line2); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--fg); white-space: nowrap; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
#top { -webkit-app-region: no-drag; }
.win { display: flex; gap: 2px; margin: -4px -8px -4px 4px; }
.win button { width: 34px; height: 28px; display: grid; place-items: center; background: none; border: 0; border-radius: 7px; color: var(--dim); cursor: pointer; transition: background 120ms, color 120ms; }
.win button:hover { background: var(--raise2); color: var(--fg); }
.win button.x:hover { background: #c7373a; color: #fff; }
#boot { position: absolute; inset: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: center; gap: 56px; padding: 0 90px; background: rgba(6, 9, 13, 0.985); }
#boot[hidden] { display: none; }
#boot.out { opacity: 0; transition: opacity 360ms ease; pointer-events: none; }
#boot .mark { display: flex; flex-direction: column; align-items: center; gap: 22px; }
#boot svg { width: 190px; height: 190px; overflow: visible; }
#boot svg .ring { fill: none; stroke-linecap: round; transform-origin: 512px 512px; opacity: 0; }
#boot svg .ring.o { stroke: var(--accent); stroke-width: 54; animation: ringin 700ms var(--ease) forwards, spin 14s linear 700ms infinite; }
#boot svg .ring.m { stroke: var(--fg); stroke-width: 24; opacity: 0; animation: ringin 700ms 180ms var(--ease) forwards, spinr 9s linear 880ms infinite; }
#boot svg .core { fill: none; stroke: var(--accent); stroke-width: 52; opacity: 0; transform-origin: 512px 512px; animation: corein 500ms 420ms var(--ease) forwards; }
#boot svg .pulse { stroke: var(--accent); stroke-width: 6; fill: none; opacity: 0; transform-origin: 512px 512px; animation: pulse 1100ms 900ms ease-out forwards; }
@keyframes ringin { from { opacity: 0; transform: rotate(-120deg) scale(0.86); } to { opacity: 1; transform: rotate(0) scale(1); } }
@keyframes corein { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } } @keyframes spinr { to { transform: rotate(-360deg); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pulse { from { opacity: 0.7; transform: scale(1); } to { opacity: 0; transform: scale(3.6); } }
#boot .name { font: 600 30px/1 var(--disp); letter-spacing: 0.3em; margin-right: -0.3em; opacity: 0; animation: fade 400ms 700ms var(--ease) forwards; }
#boot .tag { color: var(--dim); font-size: 13px; opacity: 0; animation: fade 400ms 900ms var(--ease) forwards; margin-top: -10px; }
#boot pre { margin: 0; font: 12.5px/1.75 var(--mono); color: var(--ink2); white-space: pre; min-height: 330px; overflow: hidden; }
#boot pre .k { color: var(--ok); } #boot pre .w { color: var(--warn); } #boot pre .f { color: var(--bad); } #boot pre .d { color: var(--faint); } #boot pre .a { color: var(--accent); }
#boot .skip { position: absolute; right: 22px; bottom: 14px; color: var(--faint); font-size: 12px; }
/* ---- git ---- */
#view.fill { padding: 0; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.ghead { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 14px 22px 0; }
.ghead h1 { margin: 0; } .ghead .br { font: 12.5px var(--mono); color: var(--ink2); } .ghead .live { margin-left: auto; color: var(--dim); font-size: 12.5px; display: inline-flex; gap: 7px; align-items: center; }
.ghead .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; } .ghead .live i.busy { background: var(--warn); }
.gsub { display: flex; gap: 18px; padding: 8px 22px 0; border-bottom: 1px solid var(--line); grid-column: 1 / -1; width: 100%; }
.gsub button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); font: inherit; padding: 4px 0 8px; cursor: pointer; } .gsub button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); } .gsub button span { color: var(--faint); font: 11.5px var(--mono); margin-left: 5px; }
.gbody { min-height: 0; display: grid; grid-template-columns: 400px minmax(0, 1fr); }
.glist { overflow-y: auto; border-right: 1px solid var(--line); padding: 6px 8px 14px; } .gview { overflow: auto; padding: 14px 0 20px; min-width: 0; }
.grow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
.grow:hover { background: var(--raise); } .grow[aria-selected="true"] { background: var(--sel); }
.grow .l { font: 12px var(--mono); color: var(--dim); } .grow .l.M { color: var(--warn); } .grow .l.A, .grow .l.N { color: var(--ok); } .grow .l.D { color: var(--bad); } .grow .l.R { color: var(--accent); }
.grow .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; } .grow .p bdi { direction: ltr; } .grow .p .d { color: var(--dim); }
.grow .c { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; } .grow .c .a { color: var(--ok); } .grow .c .r { color: var(--bad); }
.crow { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 6px 10px 6px 34px; border-radius: 7px; cursor: pointer; }
.crow:hover { background: var(--raise); } .crow[aria-selected="true"] { background: var(--sel); }
.crow .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .crow .s { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .crow .s code { background: none; padding: 0; color: var(--ink2); }
.trow { display: flex; gap: 6px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 3px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; } .trow:hover { background: var(--raise); } .trow[aria-selected="true"] { background: var(--sel); } .trow .tw { width: 10px; color: var(--faint); font: 11px var(--mono); } .trow.dir { color: var(--ink2); } .trow .l { font: 11.5px var(--mono); margin-left: auto; padding-left: 10px; }
.gview .pad { padding: 0 22px; }
.diff { font: 12.5px/1.55 var(--mono); min-width: max-content; }
