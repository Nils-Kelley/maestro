# The tmux server Maestro keeps its sessions in (`tmux -L maestro`). It is separate from your own tmux and uses none of its settings.
# Its job is to keep a session and its scroll-back alive when the Maestro window is closed; it should otherwise be invisible.
set -g status off
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -asq terminal-features ",xterm-256color:RGB"
set -sq extended-keys on
set -asq terminal-features ",xterm*:extkeys"
# Highlighting copies: drag (or double / triple click) and the text goes to the Windows clipboard when the button is released,
# as in an ordinary tmux. tmux hands the text to the terminal as an OSC 52 sequence; Maestro puts it on the clipboard.
set -gq set-clipboard on
set -asq terminal-features ",xterm-256color:clipboard"
set -gq allow-passthrough on
setw -g aggressive-resize on

# Copying while scrolled back must not throw you to the bottom. tmux's own binding copies and leaves scroll-back at once, so the
# text you had scrolled up to jumped away as soon as the mouse button came up. Here the copy keeps your place and the highlight
# when you are scrolled back, and only leaves (as before) when you were already at the bottom, so typing still goes to the program.
# Scrolling back down to the bottom leaves scroll-back by itself; so does q or Esc.
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
bind-key -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
bind-key -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
# a plain click while scrolled back only clears the highlight; it does not move you
bind-key -T copy-mode    MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
